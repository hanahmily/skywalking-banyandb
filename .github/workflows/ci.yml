# FORK-LOCAL CI. This fork is pr-nursing's test bed, not a release gate.
#
# Upstream ci.yml fans out to ~25 checks: banyand, bydbctl, fodc, pkg, both
# integration matrices (six variants each) and e2e. On a test bed that is
# minutes of wall clock per fixture PR and proves nothing pr-nursing needs.
#
# What is left is `Check` and the `prepare` it depends on. That is deliberate:
# `Check` is exactly what pr-nursing's own project_gate mirrors -- consistency,
# generated-test drift, license headers, requirements, build, lint, and
# check-format -- so a PR that goes green here is a PR that would clear the
# gate, which is the only signal the nursing tests actually read.
#
# Every other workflow file has been deleted on this fork. To restore upstream
# CI, sync this fork's .github/ from apache/skywalking-banyandb.
#
# paths-ignore is kept as upstream has it: a docs-only change genuinely runs
# nothing here, and pr-nursing has to cope with a PR that has no checks at all.
name: Continuous Integration

on:
  pull_request:
    paths-ignore:
      - 'canopy/**'
      - 'ui/**'
      - 'docs/**'
      - '**.md'
      - '.github/workflows/canopy.yml'
  push:
    branches:
      - main

env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 5

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare (Generate)
    uses: ./.github/workflows/prepare.yml

  check:
    name: Check
    runs-on: ubuntu-latest
    needs: [prepare]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-tags: true
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          download-artifacts: 'true'
          setup-docker: 'false'
      - name: Cache Tools
        uses: actions/cache@v4
        id: cache-tool
        with:
          path: bin
          key: ${{ runner.os }}-${{ runner.arch }}-generate-tool-${{ hashFiles('scripts/build/version.mk') }}
      - name: npm ci and format
        run: |
          make -C ui install
          cd ui
          npm run format
          cd ../
      - name: Run consistency check
        run: |
          if [ ! -z "`git status -s`" ]; then \
            echo "Following files are not consistent with CI:"; \
            git status -s; \
            exit 1; \
          fi
      - name: Generate test cases and check drift
        run: |
          make generate-test-cases
          git diff --exit-code -- test/cases/measure/data/input/ \
          || (echo "::error::Generated test cases have drifted. Run 'make generate-test-cases' locally and commit the changes." \
          && git diff --stat -- test/cases/measure/data/input/ \
          && exit 1)
      - name: Check License Header
        run: make license-check
      - name: Check requirements
        run: make check-req
      - name: Build binaries, UI dist and MCP dist
        run: make build
      - name: Test MCP (Go validator tool + TypeScript safety layer)
        run: make -C mcp test
      - name: Lint
        run: make lint
      - name: Generate dependencies licenses
        run: make license-dep
      - name: Check
        run: make check-format
